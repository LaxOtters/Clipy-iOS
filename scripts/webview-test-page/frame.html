<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iframe</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 12px; font: 15px/1.5 -apple-system, sans-serif; }
    button { padding: 8px 12px; border: 1px solid #8888; border-radius: 8px; background: #8881; color: inherit; font: inherit; }
  </style>
</head>
<body>
  <p>iframe origin: <code id="origin"></code></p>
  <button onclick="alert('Alert from the iframe.')">alert inside iframe</button>
  <script>
    document.getElementById('origin').textContent = location.host;
  </script>
</body>
</html>
